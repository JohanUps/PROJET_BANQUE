version: '3.8'

services:

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: minibank
      MARIADB_USER: root
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./src/sql:/docker-entrypoint-initdb.d

  php:
    image: php:8.2-fpm
    depends_on:
      - db
    volumes:
      - .:/var/www/html
    command: sh -c "docker-php-ext-install pdo pdo_mysql && php-fpm"

  nginx:
    image: nginx:latest
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: minibank_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db                # correspond au nom du service MySQL
      PMA_PORT: 3306
      PMA_USER: root              # identifiant défini dans db
      PMA_PASSWORD: root      # mot de passe défini dans db
    ports:
      - "8081:80"   